<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gharbee Enterprise Dashboard</title>
    <style>
        * { box-sizing: border-box; font-family: '-apple-system', sans-serif; margin: 0; padding: 0; }
        body { background-color: #f1f5f9; color: #0D4C3A; padding: 10px; }
        .dashboard-container { max-width: 500px; margin: 0 auto; background: white; border-radius: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); overflow: hidden; min-height: 90vh; display: flex; flex-direction: column; }
        .header { background: linear-gradient(135deg, #0D4C3A 0%, #062c21 100%); color: white; padding: 25px 20px; text-align: center; }
        .brand { font-size: 26px; font-weight: 800; }
        .orange-text { color: #F89A1C; }
        .tabs { display: flex; background: #e2e8f0; padding: 5px; }
        .tab-btn { flex: 1; padding: 12px; border: none; background: none; font-weight: 600; font-size: 13px; color: #64748b; cursor: pointer; border-radius: 10px; }
        .tab-btn.active { background: white; color: #0D4C3A; }
        .content-section { padding: 20px; flex: 1; display: none; }
        .content-section.active { display: block; }
        .card { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 15px; padding: 15px; margin-bottom: 15px; }
        .btn { width: 100%; border: none; padding: 12px; border-radius: 10px; font-weight: 600; cursor: pointer; margin-top: 5px; text-decoration: none; text-align: center; display: block; }
        .status-badge { font-size: 11px; padding: 3px 8px; border-radius: 20px; font-weight: 700; float: right; }
        .status-pending { background: #fef3c7; color: #d97706; }
        .status-active { background: #dcfce7; color: #15803d; }
        .partner-row { display: flex; justify-content: space-between; align-items: center; background: white; padding: 12px; border-radius: 10px; border: 1px solid #e2e8f0; margin-bottom: 8px; }
    </style>
</head>
<body>
<div class="dashboard-container">
    <div class="header">
        <div class="brand">Ghar<span class="orange-text">bee</span> Control Room</div>
        <div style="font-size:12px; opacity:0.8; margin-top:4px;">Enterprise Live Admin Engine</div>
    </div>
    <div style="padding: 15px 20px 0 20px;">
        <a href="partner.html?mode=apply" target="_blank" class="btn" style="background:#0D4C3A; color:white;">➕ Open Partner Request Form (Test)</a>
    </div>
    <div class="tabs" style="margin-top:15px;">
        <button id="t1" class="tab-btn active" onclick="switchTab('approval', 't1')">1. Onboarding Approval</button>
        <button id="t2" class="tab-btn" onclick="switchTab('crm', 't2')">2. Active CRM Network</button>
    </div>

    <!-- 1. APPROVAL TAB -->
    <div id="approval" class="content-section active">
        <div id="liveApprovalList">
            <div class="card">
                <h4 style="font-size:14px;">Amit Sharma (Plumber) <span class="status-badge status-pending">PENDING</span></h4>
                <p style="font-size:12px; color:#64748b; margin-top:5px;">📄 आधार कार्ड व लाइव मास्क फोटो: Verified</p>
                <button class="btn" style="background:#F89A1C; color:white;" onclick="approvePartner()">Final Verify & Onboard</button>
            </div>
        </div>
    </div>

    <!-- 2. ACTIVE CRM NETWORK TAB -->
    <div id="crm" class="content-section">
        <div id="liveActiveList">
            <div class="partner-row"><div><b>Supervisor Aliganj (TL)</b></div><span class="status-badge status-active">Active</span></div>
            <div id="newOnboardedRow" class="partner-row" style="display:none; background:#f0fdf4;"><div><b id="onboardedName">Amit Sharma (Plumber)</b></div><span class="status-badge status-active">Onboarded</span></div>
        </div>
        <div style="font-size: 15px; font-weight: 700; margin-top: 20px; margin-bottom: 10px;">Live Performance Charts</div>
        <div class="card" style="background:white;">
            <div style="display:flex; justify-content:space-between; font-size:12px; font-weight:700; margin-bottom:4px;">
                <span>🔧 Ramesh Kumar (Plumber)</span><span style="color:#22c55e;">⭐ 5.0 / 5.0</span>
            </div>
            <div style="width:100%; background:#e2e8f0; height:8px; border-radius:10px;"><div style="width:100%; background:#22c55e; height:100%; border-radius:10px;"></div></div>
        </div>
    </div>
</div>

<script>
    function switchTab(tabId, btnId) {
        document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        document.getElementById(btnId).classList.add('active');
    }
    function approvePartner() {
        document.getElementById('liveApprovalList').innerHTML = "<p style='text-align:center; color:#94a3b8; font-size:13px; padding:20px;'>😎 कोई पेंडिंग रिक्वेस्ट नहीं है।</p>";
        document.getElementById('newOnboardedRow').style.display = 'flex';
        alert("सफल! पार्टनर पूरी तरह एक्टिवेट हो गया है और अपने ऐप से लॉगिन कर सकता है।");
    }
</script>
</body>
</html>
