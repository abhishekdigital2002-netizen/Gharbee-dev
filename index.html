<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gharbee Ultimate Customer App</title>
    <link href="https://googleapis.com" rel="stylesheet">
    
    <!-- External Files Link Karein -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-container">
  
  <!-- APP HEADER (Common Logo & Location) -->
  <div style="background: #063A25; padding: 20px 16px; border-radius: 0 0 20px 20px; color: #ffffff;">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <div style="display: flex; align-items: center; gap: 8px;">
        <span style="font-size: 24px;">🐝</span>
        <span style="font-size: 20px; font-weight: 800; letter-spacing: 0.5px;">Ghar<span style="color: #F5A623;">bee</span></span>
      </div>
      <div>
        <button onclick="handleLogout()" style="background: rgba(255,255,255,0.15); border: none; color: #fff; padding: 6px 12px; border-radius: 8px; font-size: 12px; cursor: pointer; font-weight: 600;">Logout ➔</button>
      </div>
    </div>
    
    <!-- Geo Location Badge -->
    <div style="margin-top: 14px; display: flex; align-items: center; gap: 6px; font-size: 12px; background: rgba(255,255,255,0.08); padding: 8px 12px; border-radius: 10px;">
      <span style="color: #F5A623;">📍</span>
      <span id="user-current-location">Detecting live location...</span>
    </div>
  </div>

  <!-- SCREEN 1: CORE MARKETPLACE HOME PANEL -->
  <div id="home-screen" class="app-screen active">
    <div style="background: #E8F5E9; border: 1px solid #C8E6C9; border-radius: 12px; padding: 12px; margin-bottom: 18px; color: #2E7D32; font-size: 12px; font-weight: 600;">
      🟢 Smart Availability Engine Active
    </div>

    <h3 style="margin: 0 0 12px; font-size: 15px; font-weight: 700;">Explore Core Services</h3>
    <div class="services-grid">
      <div class="service-card active" onclick="switchMainService('AC Repair & Service')">
        <div style="font-size: 26px; margin-bottom: 6px;">❄️</div><div style="font-size: 11px; font-weight: 700;">AC Repair</div>
      </div>
      <div class="service-card" onclick="switchMainService('Plumbing')">
        <div style="font-size: 26px; margin-bottom: 6px;">🚰</div><div style="font-size: 11px; font-weight: 600;">Plumbing</div>
      </div>
      <div class="service-card" onclick="switchMainService('Electrician')">
        <div style="font-size: 26px; margin-bottom: 6px;">⚡</div><div style="font-size: 11px; font-weight: 600;">Electrician</div>
      </div>
    </div>

    <!-- Target Injection Zones (Where JS injects code dynamically) -->
    <h3 style="margin: 0 0 12px; font-size: 15px; font-weight: 700;">Select Sub-Service Option</h3>
    <div id="subservices-target-area"></div>

    <h3 style="margin: 16px 0 12px; font-size: 15px; font-weight: 700;">Live Partners Near You</h3>
    <div id="live-partners-target-area"></div>

    <h3 style="margin: 16px 0 12px; font-size: 15px; font-weight: 700;">Choose Execution Date</h3>
    <div class="scroll-clean" style="display: flex; gap: 8px; overflow-x: auto; margin-bottom: 24px;">
      <div class="date-pill active" onclick="toggleDate(this, 'Today')">Today<br><span style="font-size: 10px; opacity: 0.8;">Oct 14</span></div>
      <div class="date-pill" onclick="toggleDate(this, 'Tomorrow')">Tomorrow<br><span style="font-size: 10px; opacity: 0.8;">Oct 15</span></div>
    </div>

    <button style="width: 100%; background: #F5A623; color:#fff; border:none; padding:16px; border-radius:14px; font-size:15px; font-weight:700; cursor:pointer;" onclick="processBooking()">मैचिंग टाइम पर बुक करें ➔</button>
  </div>

  <!-- SCREEN 2: HISTORY ARCHIVE PANEL -->
  <div id="bookings-screen" class="app-screen">
    <h3 style="margin: 0 0 16px; font-size: 18px; font-weight: 700;">Your Booking History</h3>
    <div id="history-records-pipeline"></div>
  </div>

  <!-- FIXED FLOATING NAVIGATION NAVIGATION BAR -->
  <div style="margin-top: auto; border-top: 1px solid #EAEAEA; background: #ffffff; padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; text-align: center;">
    <div id="nav-home" style="color: #063A25; font-size: 11px; font-weight: 700; cursor: pointer;" onclick="toggleAppView('home')">
      <div style="font-size: 20px; margin-bottom: 2px;">🏠</div>Home
    </div>
    <div id="nav-bookings" style="color: #8E8E93; font-size: 11px; font-weight: 500; cursor: pointer;" onclick="toggleAppView('bookings')">
      <div style="font-size: 20px; margin-bottom: 2px;">📋</div>Bookings
    </div>
    <div style="color: #8E8E93; font-size: 11px; font-weight: 500; cursor: pointer;">
      <div style="font-size: 20px; margin-bottom: 2px;">🛠️</div>Support
    </div>
  </div>
</div>

<!-- JavaScript Logic Ko Link Karein -->
<script src="app.js"></script>
</body>
</html>
