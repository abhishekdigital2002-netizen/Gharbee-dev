<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gharbee Ultimate Customer App</title>
    <!-- Premium Aesthetics Ke Liye Inter Font -->
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        body { margin: 0; padding: 0; background-color: #042518; font-family: 'Inter', sans-serif; display: flex; justify-content: center; min-height: 100vh; }
        .app-container { max-width: 450px; width: 100%; background: #ffffff; min-height: 100vh; display: flex; flex-direction: column; box-shadow: 0 0 30px rgba(0,0,0,0.3); }
        .service-card { background: #ffffff; border: 1px solid #EAEAEA; border-radius: 16px; padding: 18px 12px; text-align: center; cursor: pointer; transition: all 0.2s ease; }
        .service-card:hover { transform: translateY(-2px); border-color: #F5A623; box-shadow: 0 6px 12px rgba(0,0,0,0.04); }
        .service-card.active { background: #FDF9F2; border: 2px solid #F5A623; }
        .date-pill { background: #F5F5F5; color: #333333; padding: 12px 14px; border-radius: 12px; text-align: center; font-size: 13px; font-weight: 600; min-width: 80px; cursor: pointer; transition: all 0.2s; }
        .date-pill.active { background: #063A25; color: #ffffff; }
        .scroll-clean::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>

<div class="app-container">
  <!-- Top Header Panel -->
  <div style="background: #063A25; padding: 24px 16px 28px; border-radius: 0 0 24px 24px; color: #ffffff;">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <div style="display: flex; align-items: center; gap: 8px;">
        <span style="font-size: 26px;">🐝</span>
        <span style="font-size: 22px; font-weight: 800; letter-spacing: 0.5px;">Ghar<span style="color: #F5A623;">bee</span></span>
      </div>
      <div style="text-align: right; font-size: 12px; opacity: 0.95; font-weight: 500;">
        <span style="color: #F5A623;">📍</span> Gomti Nagar, Lucknow
      </div>
    </div>

    <!-- Status Engine Badge -->
    <div style="background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12); border-radius: 14px; padding: 14px; margin-top: 20px;">
      <div style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; color: #69F0AE;">
        <span style="width: 8px; height: 8px; background: #69F0AE; border-radius: 50%; display: inline-block; box-shadow: 0 0 8px #69F0AE;"></span>
        Smart Availability Engine Active
      </div>
      <p style="margin: 6px 0 0; font-size: 12px; opacity: 0.85; line-height: 1.4; font-weight: 400;">तारीख चुनते ही हमारे पार्टनर्स का लाइव खाली शेड्यूल लोड हो जाएगा।</p>
    </div>
  </div>

  <!-- Interaction Form Block -->
  <div style="padding: 24px 16px; flex: 1;">
    <h3 style="margin: 0 0 14px; font-size: 16px; font-weight: 700; color: #111111;">Select Service</h3>
    
    <!-- Grid System -->
    <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 28px;">
      <div class="service-card active" onclick="selectService(this, 'AC Repair & Service')">
        <div style="font-size: 34px; margin-bottom: 8px;">❄️</div>
        <div style="font-size: 13px; font-weight: 700; color: #063A25; line-height: 1.3;">AC Repair & Service</div>
      </div>
      <div class="service-card" onclick="selectService(this, 'Plumber')">
        <div style="font-size: 34px; margin-bottom: 8px;">🚰</div>
        <div style="font-size: 13px; font-weight: 600; color: #4A4A4A; line-height: 1.3;">Plumber (नलसाज)</div>
      </div>
    </div>

    <!-- Date Selection Pills -->
    <h3 style="margin: 0 0 14px; font-size: 16px; font-weight: 700; color: #111111;">Choose Date</h3>
    <div class="scroll-clean" style="display: flex; gap: 10px; margin-bottom: 36px; overflow-x: auto; padding-bottom: 4px;">
      <div class="date-pill active" onclick="selectDate(this, 'Today')">Today<br><span style="font-size: 11px; opacity: 0.8;">Oct 14</span></div>
      <div class="date-pill" onclick="selectDate(this, 'Tomorrow')">Tomorrow<br><span style="font-size: 11px; opacity: 0.8;">Oct 15</span></div>
      <div class="date-pill" onclick="selectDate(this, 'Friday')">Fri<br><span style="font-size: 11px; opacity: 0.8;">Oct 16</span></div>
    </div>

    <!-- Action Button -->
    <button id="bookButton" style="width: 100%; background: #F5A623; color: #ffffff; border: none; padding: 18px; border-radius: 16px; font-size: 15px; font-weight: 700; cursor: pointer; box-shadow: 0 6px 20px rgba(245, 166, 35, 0.3); transition: background 0.2s;" onclick="triggerBooking()">
      मैचिंग टाइम पर बुक करें ➔
    </button>
  </div>

  <!-- Bottom Navigation Panel -->
  <div style="border-top: 1px solid #EAEAEA; background: #ffffff; padding: 14px 24px; display: flex; justify-content: space-between; align-items: center; text-align: center; border-radius: 20px 20px 0 0; box-shadow: 0 -4px 10px rgba(0,0,0,0.02);">
    <div style="color: #063A25; font-size: 11px; font-weight: 700; cursor: pointer;">
      <div style="font-size: 22px; margin-bottom: 4px;">🏠</div>Home
    </div>
    <div style="color: #8E8E93; font-size: 11px; font-weight: 500; cursor: pointer;" onclick="window.location.href='dashboard.html'">
      <div style="font-size: 22px; margin-bottom: 4px;">📋</div>Bookings
    </div>
    <div style="color: #8E8E93; font-size: 11px; font-weight: 500; cursor: pointer;">
      <div style="font-size: 22px; margin-bottom: 4px;">🛠️</div>Support
    </div>
  </div>
</div>

<!-- Interactive Logic Scripts -->
<script>
    let selectedService = "AC Repair & Service";
    let selectedDate = "Today";

    function selectService(element, serviceName) {
        document.querySelectorAll('.service-card').forEach(card => card.classList.remove('active'));
        element.classList.add('active');
        selectedService = serviceName;
    }

    function selectDate(element, dateValue) {
        document.querySelectorAll('.date-pill').forEach(pill => pill.classList.remove('active'));
        element.classList.add('active');
        selectedDate = dateValue;
    }

    function triggerBooking() {
        alert("Gharbee Booking Engine: Processing " + selectedService + " for " + selectedDate + "!");
        // Yahan aap apna server API ya fetch process map kar sakte hain.
    }
</script>
</body>
</html>
