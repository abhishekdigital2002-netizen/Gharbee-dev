<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gharbee Customer App</title>
    <style>
        * { box-sizing: border-box; font-family: '-apple-system', sans-serif; margin: 0; padding: 0; }
        body { background-color: #062c21; display: flex; justify-content: center; min-height: 100vh; color: #1e293b; padding: 0; }
        .phone-screen { width: 100%; max-width: 430px; background: #ffffff; min-height: 100vh; display: flex; flex-direction: column; position: relative; box-shadow: 0 10px 40px rgba(0,0,0,0.5); padding-bottom: 75px; overflow: hidden; }
        .app-header { background: linear-gradient(135deg, #0D4C3A 0%, #062c21 100%); color: white; padding: 25px 20px; border-bottom-left-radius: 25px; border-bottom-right-radius: 25px; }
        .header-top { display: flex; align-items: center; justify-content: space-between; }
        .logo-wrap { display: flex; align-items: center; gap: 8px; }
        .logo-icon { width: 35px; height: 35px; background: #ffffff; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .brand-name { font-size: 24px; font-weight: 800; }
        .orange-txt { color: #F89A1C; }
        .loc-text { font-size: 13px; color: #e2e8f0; text-align: right; }
        .main-body { padding: 20px; flex: 1; overflow-y: auto; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .offer-card { background: linear-gradient(135deg, #F89A1C 0%, #e68a0d 100%); color: white; padding: 18px; border-radius: 18px; margin-bottom: 20px; }
        .coupon-section { background: #f8fafc; border: 1.5px dashed #0D4C3A; padding: 12px; border-radius: 14px; margin-bottom: 25px; display: flex; gap: 10px; }
        .coupon-input { flex: 1; padding: 12px; border: 1px solid #cbd5e1; border-radius: 10px; outline: none; font-weight: 700; text-transform: uppercase; }
        .coupon-btn { background: #0D4C3A; color: white; border: none; padding: 12px 20px; border-radius: 10px; font-weight: 700; cursor: pointer; }
        .grid-container { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        .service-box { background: #ffffff; border: 1px solid #f1f5f9; border-radius: 20px; padding: 20px 15px; text-align: center; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.02); }
        .img-icon-wrapper { width: 50px; height: 50px; background: #f0fdf4; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 26px; margin: 0 auto 10px auto; color: #0D4C3A; }
    </style>
</head>
<body>
<div class="phone-screen">
    <div class="app-header">
        <div class="header-top">
            <div class="logo-wrap"><div class="logo-icon">🐝</div><div class="brand-name">Ghar<span class="orange-txt">bee</span></div></div>
            <div class="loc-text">📍 Gomti Nagar,<br><span style="font-size:11px; opacity:0.8;">Lucknow</span></div>
        </div>
    </div>

    <!-- 🏠 होम स्क्रीन -->
    <div id="homeTab" class="main-body tab-content active">
        <div class="offer-card">
            <div style="font-size: 17px; font-weight: 700; margin-bottom:3px;">First Booking Offer!</div>
            <div style="font-size: 12px; opacity: 0.95;">घर के किसी भी काम पर पाएं फ्लैट 20% की छूट।</div>
        </div>
        <div class="coupon-section">
            <input type="text" id="couponInput" class="coupon-input" placeholder="कूपन कोड (GHARBEE20)">
            <button class="coupon-btn" onclick="applyCoupon()">Apply</button>
        </div>
        <div style="font-size: 16px; font-weight: 700; color: #0D4C3A; margin-bottom: 15px;">Our Expert Services</div>
        <div class="grid-container">
            <div class="service-box" onclick="makeLiveBooking(1, 'Plumber')">
                <div class="img-icon-wrapper">🔧</div><div style="font-size: 14px; font-weight: 700; color: #334155;">Plumber</div>
                <div style="font-size: 11px; color: #F89A1C; font-weight: 700; margin-top: 5px; background: #fff7ed; padding: 3px 8px; border-radius: 20px; display: inline-block;">₹199 से</div>
            </div>
            <div class="service-box" onclick="makeLiveBooking(5, 'AC Repair')">
                <div class="img-icon-wrapper">❄️</div><div style="font-size: 14px; font-weight: 700; color: #334155;">AC Repair</div>
                <div style="font-size: 11px; color: #F89A1C; font-weight: 700; margin-top: 5px; background: #fff7ed; padding: 3px 8px; border-radius: 20px; display: inline-block;">₹399 से</div>
            </div>
        </div>
    </div>

    <!-- 📋 बुकिंग्स टैब -->
    <div id="bookingsTab" class="main-body tab-content">
        <div style="font-size: 16px; font-weight: 700; color: #0D4C3A; margin-bottom: 15px;">आपकी बुकिंग्स</div>
        <div id="liveBookingsContainer"><p style="text-align:center; color:#94a3b8; padding:30px; font-size:14px;">अभी कोई बुकिंग नहीं है।</p></div>
    </div>

    <!-- 👛 वॉलेट टैब -->
    <div id="walletTab" class="main-body tab-content">
        <div style="font-size: 16px; font-weight: 700; color: #0D4C3A; margin-bottom: 15px;">Gharbee Wallet</div>
        <div style="background: linear-gradient(135deg, #0D4C3A, #062c21); color: white; padding: 25px; border-radius: 20px; text-align: center; margin-bottom: 20px;">
            <p style="font-size:13px; opacity:0.8;">उपलब्ध बैलेंस</p><h2 style="font-size:32px; margin-top:5px;">₹0.00</h2>
        </div>
    </div>
    <!-- 📱 फिक्स्ड बॉटम नेविगेशन बार (UI इशू 100% सोल्व्ड) -->
    <div style="position: absolute; bottom: 0; left: 0; width: 100%; height: 70px; background: #ffffff; border-top: 1px solid #f1f5f9; display: flex; justify-content: space-around; align-items: center; box-shadow: 0 -4px 15px rgba(0,0,0,0.05); padding: 0 10px;">
        <button id="navHome" style="flex:1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #0D4C3A; font-size: 12px; font-weight: 700; background: none; border: none; cursor: pointer; height:100%;" onclick="switchTab('homeTab', 'navHome')"><span style="font-size:20px; margin-bottom:2px; display:block;">🏠</span>Home</button>
        <button id="navBook" style="flex:1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #94a3b8; font-size: 12px; font-weight: 600; background: none; border: none; cursor: pointer; height:100%;" onclick="switchTab('bookingsTab', 'navBook')"><span style="font-size:20px; margin-bottom:2px; display:block;">📋</span>Bookings</button>
        <button id="navWallet" style="flex:1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #94a3b8; font-size: 12px; font-weight: 600; background: none; border: none; cursor: pointer; height:100%;" onclick="switchTab('walletTab', 'navWallet')"><span style="font-size:20px; margin-bottom:2px; display:block;">👛</span>Wallet</button>
    </div>
</div>

<script>
    const SERVER_URL = "https://onrender.com";
    let isDiscountApplied = false;

    function switchTab(tabId, navId) {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.getElementById('navHome').style.color = '#94a3b8';
        document.getElementById('navBook').style.color = '#94a3b8';
        document.getElementById('navWallet').style.color = '#94a3b8';
        document.getElementById(tabId).classList.add('active');
        document.getElementById(navId).style.color = '#0D4C3A';
    }
    function applyCoupon() {
        if(document.getElementById('couponInput').value.trim().toUpperCase() === "GHARBEE20") {
            isDiscountApplied = true; alert("✅ कूपन कोड अप्लाई हो गया है!");
        } else { alert("❌ गलत कूपन कोड!"); }
    }
    function makeLiveBooking(id, name) { alert(`सफल! आपका ${name} बुक हो गया है।`); }
</script>
</body>
</html>
